# On every published GitHub release (tag vX.Y.Z) update this service's entry in the public rig
# registry: rewrite services/glim/manifest.yaml (version + source.rev), regenerate index.json
# with the registry's own tooling, push. The manifest is OWNED by this workflow — it rewrites the
# file wholesale, so registry-side hand edits to it do not survive the next release.
#
# One-time setup: a RIG_REGISTRY_TOKEN Actions secret in THIS repo — fine-grained PAT scoped to
# christomaszewski/rig-registry-public with Contents read/write, nothing else.
name: registry-release

on:
  release:
    types: [published]

permissions:
  contents: read

# Serialize releases — two concurrent runs would race the registry push.
concurrency:
  group: registry-release

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - name: derive version from tag
        id: meta
        run: |
          echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::release tag '${GITHUB_REF_NAME}' is not vX.Y.Z — registry versions are exact X.Y.Z"
            exit 1
          }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The write token is used for the push alone (below), never stored in registry/.git/config
      # where the registry's own tooling would run with it.
      - uses: actions/checkout@v4
        with:
          repository: christomaszewski/rig-registry-public
          path: registry
          persist-credentials: false

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      # Pinned: this job runs with a write token for the public registry.
      - name: install rig (registry validate/index tooling)
        run: pip install "git+https://github.com/christomaszewski/rig@v0.2.71"

      # GITHUB_SHA on a release event is the tagged commit — exactly the rev consumers should pin.
      # Other services release into the same registry: on a non-fast-forward, start over from its
      # new head (the manifest is rewritten wholesale and index.json regenerated, never merged).
      - name: publish (rewrite manifest, regenerate index, push; retried on races)
        working-directory: registry
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TOKEN: ${{ secrets.RIG_REGISTRY_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${TOKEN}@github.com/christomaszewski/rig-registry-public.git"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet "$remote" HEAD
            git reset --quiet --hard FETCH_HEAD
            mkdir -p services/glim
            cat > services/glim/manifest.yaml <<EOF
          # AUTO-UPDATED on every glim release by the glim-service repo's registry-release workflow
          # (rewrites this file wholesale + regenerates index.json). Hand-edits will be clobbered
          # by the next release — change the workflow in the glim-service repo instead.
          kind: service
          name: glim
          version: ${VERSION}
          platforms: [linux/amd64, linux/arm64]
          ros_distro: lyrical
          instantiable: true            # template service — one config per SLAM instance instantiates it
          source:
            repo: https://github.com/christomaszewski/glim-service.git
            rev: ${GITHUB_SHA}
          EOF
            ./tools/gen-index
            ./tools/validate
            git add services/glim/manifest.yaml index.json
            if git diff --staged --quiet; then
              echo "registry already current for glim ${VERSION}"
              exit 0
            fi
            git commit --quiet -m "glim ${VERSION} (auto: release ${GITHUB_REF_NAME})"
            if git push --quiet "$remote" HEAD:main; then
              exit 0
            fi
            echo "push raced another release (attempt ${attempt}); retrying from the new head"
            sleep $((attempt * 5))
          done
          echo "::error::could not publish glim ${VERSION} to the registry after 5 attempts"
          exit 1
